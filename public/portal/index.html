<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CXO Studio — client cockpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAFAFA; --card:#FFFFFF; --surface:#F4F4F5; --ink:#09090B; --muted:#71717A; --subtle:#A1A1AA;
    --line:#E4E4E7; --line-strong:#D4D4D8; --track:#EDEDF0;
    --cta:#09090B; --cta-text:#FAFAFA;
    --good:#22A06B; --warn:#FB923C; --over:#E0453F; --blue:#0099FF; --state:var(--good);
    --shadow:0 .6px .6px -1.25px rgba(0,0,0,.11), 0 2.29px 2.29px -2.5px rgba(0,0,0,.1), 0 10px 10px -3.75px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{overflow-x:clip}
  body{background:var(--bg); color:var(--ink); font-family:'Inter Tight',Inter,system-ui,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; align-items:flex-start; min-height:100vh; overflow-x:clip; padding:28px 22px}
  .shell{width:100%; max-width:1280px; position:relative; z-index:1}
  .glow{position:fixed; inset:0 0 auto; height:78vh; z-index:0; pointer-events:none;
    background:linear-gradient(282deg,#fff 11%,#f3f0e8b8 25%,#40c6ff9e 34%,#79dfffd9 47%,#4bfe85f5 57.67%,#fff 90%);
    opacity:.24; filter:blur(48px)}
  .head{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; padding:0 2px; min-height:34px}
  .head img{display:block; width:auto}
  .logo-cxo{height:24px} .logo-sl{height:34px}
  .wordmark{font-family:'Plus Jakarta Sans',sans-serif; font-weight:600; font-size:19px}
  .hide{display:none}
  /* These four set `display` further down the sheet at the same specificity, which would
     otherwise beat the .hide utility. Keep this list in sync when adding display rules. */
  .scorecard.hide,.perfcard.hide,.grid.hide,.mnav.hide{display:none}
  .scorecard{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:16px}
  .score{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:15px 16px; display:flex; align-items:baseline; justify-content:space-between; gap:8px; min-width:0}
  .score .n{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:31px; line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
  .score .l{font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:#52525B; font-weight:600}
  .score.t .n{color:#FF6969} .score.p .n{color:#FB923C} .score.d .n{color:#48D87D} .score.b .n{color:#A1A1AA}
  .perfcard{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px;
    background:var(--card); border:1px solid var(--line); border-radius:15px; box-shadow:var(--shadow);
    padding:15px 20px; text-decoration:none; color:var(--ink); transition:border-color .15s}
  .perfcard:hover{border-color:var(--line-strong)}
  .perftitle{font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; color:#52525B; font-weight:600; margin-bottom:3px}
  .perfdesc{font-size:15px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .perfbtn{font-size:14px; font-weight:600; color:var(--cta-text); background:var(--cta); border-radius:10px; padding:9px 16px; white-space:nowrap; flex-shrink:0}
  .grid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:auto auto 1fr; gap:16px; align-items:start; grid-template-areas:"tasks hours" "tasks request" "tasks ."}
  #tasksPanel{grid-area:tasks} #hoursPanel{grid-area:hours} .reqbox{grid-area:request}
  @media (max-width:860px){
    .grid{grid-template-columns:minmax(0,1fr); grid-template-rows:auto; grid-template-areas:"hours" "tasks" "request"}
    .scorecard{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:560px){
    body{padding:16px 14px}
    .panel{padding:18px 16px}
    .scorecard{gap:10px}
    .score{flex-direction:column; align-items:flex-start; gap:3px}
    .head .logo-cxo{height:20px} .head .logo-sl{height:28px}
    .foot{flex-wrap:wrap; gap:8px}
    .big{font-size:46px} .payg-hero .big{font-size:48px}
    .pill-row{gap:8px} .pill{padding:10px 9px}
    #basisPill{display:none}
    .perfcard{flex-direction:column; align-items:flex-start; gap:12px}
    .perfbtn{width:100%; text-align:center}
  }
  .panel{background:var(--card); border:1px solid var(--line); border-radius:15px; box-shadow:var(--shadow); padding:20px 22px}
  .paneltitle{font-size:12.5px; letter-spacing:.05em; text-transform:uppercase; color:#52525B; font-weight:600; margin:0 0 14px}
  .group{margin-bottom:16px}
  .grouphd{display:flex; align-items:center; gap:8px; margin:0 0 9px}
  .grouphd .t{font-size:12.5px; letter-spacing:.04em; text-transform:uppercase; color:#52525B; font-weight:600}
  .grouphd .c{font-size:12px; color:var(--muted); background:var(--surface); border-radius:20px; padding:1px 9px; font-variant-numeric:tabular-nums}
  .titem{margin-bottom:7px}
  .tcard{display:flex; align-items:center; gap:10px; padding:11px 13px; border:1px solid var(--line); border-radius:10px; font-size:15px; line-height:1.4}
  .tcard.clk{cursor:pointer}
  .tcard.clk:hover{border-color:var(--muted)}
  .tcard .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0}
  .tcard .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0}
  .tcard .chev{color:var(--muted); font-size:16px; transition:transform .15s ease; flex-shrink:0}
  .titem.open .tcard .chev{transform:rotate(90deg)}
  .titem.open .tcard{border-color:var(--muted); border-bottom-left-radius:0; border-bottom-right-radius:0}
  .tcard.done{color:var(--muted); background:var(--surface); border-color:transparent}
  .tdetail{border:1px solid var(--line-strong); border-top:0; border-radius:0 0 10px 10px; padding:13px 14px; font-size:14px; background:var(--surface)}
  .tdetail .dmeta{font-size:12px; color:var(--muted); margin-bottom:6px}
  .tdetail .ddesc{color:var(--ink); white-space:pre-wrap; line-height:1.6}
  .tdetail .dsubh{font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); margin:10px 0 6px}
  .tdetail .sub{display:flex; align-items:center; gap:8px; padding:3px 0}
  .tdetail .sub .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0}
  .tdetail .sub .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .tdetail .sub .name.done{color:var(--muted); text-decoration:line-through}
  .more{font-size:12px; color:var(--muted); padding:2px}
  .empty{font-size:13px; color:var(--muted); padding:2px 0 6px}
  /* hours */
  .gauge{position:relative; width:100%; max-width:440px; margin:0 auto}
  svg{display:block; width:100%; height:auto}
  .arc-track{stroke:var(--track)}
  .arc-value{stroke:var(--state); transition:stroke-dashoffset .9s cubic-bezier(.22,.61,.36,1), stroke .4s ease}
  .readout{position:absolute; left:0; right:0; top:52%; text-align:center}
  .big{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:52px; line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
  .big .unit{font-size:21px; color:var(--muted); margin-left:2px}
  .sub2{font-size:13.5px; color:#52525B; margin-top:6px}
  .payg-hero{text-align:center; padding:8px 0 2px} .payg-hero .big{font-size:54px}
  .compbar{display:flex; height:14px; border-radius:7px; overflow:hidden; margin:16px 0 2px; background:var(--track)}
  .compbar .seg{height:100%}
  .compbar .seg+.seg{box-shadow:-2px 0 0 var(--card)}
  /* the last slice absorbs percentage rounding so the bar reads as exactly full */
  .compbar .seg:last-child{flex:1 1 auto}
  .pill-row{display:flex; gap:10px; margin:16px 0 4px}
  .pill{flex:1; min-width:0; border:1px solid var(--line); border-radius:12px; padding:11px}
  .pill .k{font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:#52525B; font-weight:600; margin-bottom:5px}
  .pill .v{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:19px; line-height:1.1; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
  .pill .v.state{color:var(--state)}
  .pill .s{font-size:12.5px; color:#52525B; margin-top:3px}
  .pill .k,.pill .v,.pill .s{overflow-wrap:break-word}
  /* month selector */
  .hourshd{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
  .hourshd .paneltitle{margin:0}
  .mnav{display:flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:10px; padding:2px; flex-shrink:0; transition:opacity .15s}
  .mnav.busy{opacity:.45}
  .mnav button{font:inherit; font-size:15px; line-height:1; color:var(--muted); background:transparent; border:0; border-radius:8px; padding:6px 10px; cursor:pointer}
  .mnav button:hover:not(:disabled){background:var(--surface); color:var(--ink)}
  .mnav button:disabled{opacity:.28; cursor:default}
  .mnav button:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
  .mnav .lbl{font-size:13px; font-weight:600; min-width:104px; text-align:center; font-variant-numeric:tabular-nums}
  .pastnote{font-size:12.5px; line-height:1.5; color:var(--muted); margin-top:14px; padding-top:12px; border-top:1px solid var(--line)}
  @media (max-width:560px){ .mnav .lbl{min-width:88px; font-size:12.5px} }
  .byhours{margin-top:16px; border-top:1px solid var(--line); padding-top:14px}
  .trow{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:15px; padding:6px 0}
  .trow .left{display:flex; align-items:center; gap:8px; min-width:0}
  .trow .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0}
  .trow .name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  .trow .hrs{color:var(--muted); font-variant-numeric:tabular-nums; flex-shrink:0}
  /* request form (right column) */
  .reqbox input,.reqbox textarea{width:100%; font:inherit; font-size:14px; color:var(--ink); background:var(--surface);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:9px; resize:vertical}
  .reqbox input:focus,.reqbox textarea:focus{outline:none; border-color:var(--muted)}
  .reqbox textarea{min-height:64px}
  .reqbtn{width:100%; font:inherit; font-size:14px; font-weight:600; letter-spacing:.02em; color:var(--cta-text); background:var(--cta); border:0; border-radius:10px; padding:12px 16px; cursor:pointer; transition:transform .2s, background .2s}
  .reqbtn:hover{background:#27272A; transform:scale(1.01)}
  .reqbtn:disabled{opacity:.5; cursor:default; transform:none}
  .reqmsg{font-size:13px; margin-top:9px}
  .reqmsg.ok{color:var(--good)} .reqmsg.err{color:var(--over)}
  .foot{display:flex; align-items:center; justify-content:space-between; margin-top:16px; padding:0 2px; font-size:12px; color:var(--muted)}
  .foot button{font:inherit; font-size:12px; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer}
  .foot button:hover{border-color:var(--muted); color:var(--ink)}
  .error{color:var(--over); font-size:14px; padding:8px 2px}
  .picker{max-width:420px; margin:60px auto}
  .picker a{display:block; padding:12px 14px; border:1px solid var(--line); background:var(--card); border-radius:12px; margin-bottom:10px; text-decoration:none; color:var(--ink); font-weight:500}
  .picker a:hover{border-color:var(--muted)}
  .gate{position:fixed; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:24px; transition:opacity .45s ease}
  .gate.hide{display:none}
  .gate.done{opacity:0; pointer-events:none}
  .gatecard{width:100%; max-width:400px; background:var(--card); border:1px solid var(--line); border-radius:15px; box-shadow:var(--shadow); padding:28px 26px; text-align:center; transition:transform .45s ease}
  .gate.done .gatecard{transform:scale(.94)}
  #gateBtn.ok{background:var(--good)}
  .gatesuccess{padding:6px 0}
  .scheck{width:76px; height:76px; display:block; margin:0 auto}
  .scircle{stroke:var(--good); stroke-width:3; fill:none; stroke-dasharray:226; stroke-dashoffset:226}
  .spath{stroke:var(--good); stroke-width:3.5; fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:50; stroke-dashoffset:50}
  .gatesuccess.play .scircle{animation:scircle .55s ease forwards}
  .gatesuccess.play .spath{animation:spath .3s .5s ease forwards}
  @keyframes scircle{to{stroke-dashoffset:0}}
  @keyframes spath{to{stroke-dashoffset:0}}
  .successlabel{margin-top:16px; font-size:15px; font-weight:600; color:var(--ink)}
  .gatehint{font-size:14px; line-height:1.6; color:#52525B; margin:0 0 16px}
  #gatePw{width:100%; font:inherit; font-size:15px; text-align:center; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px}
  #gatePw:focus{outline:none; border-color:var(--muted)}
  #gateBtn{width:100%; font:inherit; font-size:14px; font-weight:600; color:var(--cta-text); background:var(--cta); border:0; border-radius:10px; padding:12px; cursor:pointer}
  #gateBtn:hover{background:#27272A}
  .gatemsg{font-size:13px; margin-top:10px; min-height:16px}
  .gatemsg.err{color:var(--over)}
  /* ── cockpit: tabs ── */
  .tabs{display:flex; gap:2px; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:3px; margin-bottom:16px; width:max-content; max-width:100%; overflow-x:auto; box-shadow:var(--shadow)}
  .tabs.hide{display:none}
  .tabs button{font:inherit; font-size:14px; font-weight:600; color:var(--muted); background:transparent; border:0; border-radius:9px; padding:9px 16px; min-height:40px; cursor:pointer; white-space:nowrap}
  .tabs button:hover{color:var(--ink)}
  .tabs button[aria-selected="true"]{background:var(--cta); color:var(--cta-text)}
  .tabs button:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
  .view.hide{display:none}
  /* ── cockpit: overview ── */
  .ovhead{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 2px 14px}
  .ovhead h1{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:26px; letter-spacing:-.02em; line-height:1.2; margin:0}
  .ovhead .meta{font-size:13px; color:var(--muted)}
  .kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; margin-bottom:16px}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px; min-width:0; display:flex; flex-direction:column; gap:6px}
  .kpi .l{font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:#52525B; font-weight:600}
  .kpi .n{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:30px; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
  .kpi .s{font-size:12.5px; color:var(--muted)}
  .deltas{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px}
  .delta{font-size:12.5px; font-weight:600; border-radius:20px; padding:2px 9px; background:var(--surface); color:#52525B; font-variant-numeric:tabular-nums; white-space:nowrap}
  .delta.up{background:#E7F6EF; color:#13704A} .delta.down{background:#FDECEB; color:#A8302B}
  .note{display:block; background:var(--card); border:1px dashed var(--line-strong); border-radius:14px; padding:14px 16px; margin-bottom:16px; font-size:14px; line-height:1.55; color:#52525B}
  .note b{color:var(--ink)}
  .note.hide,.kpis.hide,.ovhead.hide,.health.hide,.roi.hide{display:none}
  .ovtop{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:16px; margin-bottom:28px; align-items:stretch}
  .roi{background:#09090B; color:#FAFAFA; border-color:#09090B; display:flex; flex-direction:column; gap:14px}
  .roi .paneltitle{color:#A1A1AA}
  .roi .big{color:#FAFAFA; font-size:46px}
  .roi .big .unit{color:#A1A1AA; font-size:18px}
  .roi .sub{font-size:14px; color:#D4D4D8; line-height:1.55}
  .roi .row{display:flex; flex-wrap:wrap; gap:10px}
  .roi .stat{flex:1 1 140px; border:1px solid #27272A; border-radius:12px; padding:11px 12px}
  .roi .stat .k{font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; color:#A1A1AA; font-weight:600}
  .roi .stat .v{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:21px; letter-spacing:-.02em; margin-top:3px; font-variant-numeric:tabular-nums}
  .roi .stat .v.good{color:#5EE29A}
  .roi .wl{display:flex; flex-direction:column; gap:6px}
  .roi .w{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; font-size:14px; padding:7px 0; border-top:1px solid #27272A}
  .roi .w .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .roi .w .u{color:#5EE29A; font-weight:600; font-variant-numeric:tabular-nums}
  .roi .w.off{color:#71717A} .roi .w.off .u{color:#71717A}
  .roi .how{font-size:12.5px; color:#A1A1AA; line-height:1.5}
  .roi .how summary{cursor:pointer; color:#D4D4D8; font-weight:600; min-height:32px; display:flex; align-items:center}
  .roi .empty2{font-size:15px; color:#D4D4D8; line-height:1.6}
  .minis2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
  .minis2 .pill .v{font-size:24px}
  .health{margin-bottom:28px}
  .health h2{font-family:'Plus Jakarta Sans',sans-serif; font-weight:700; font-size:20px; letter-spacing:-.02em; margin:0}
  .kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
  .funnelp{margin-top:16px}
  .frow{display:grid; grid-template-columns:150px minmax(0,1fr) 92px 96px; gap:12px; align-items:center; font-size:14px; padding:6px 0}
  .frow .bars{display:flex; flex-direction:column; gap:4px}
  .frow .b{height:9px; background:var(--track); border-radius:5px; overflow:hidden}
  .frow .b span{display:block; height:100%; border-radius:5px}
  .frow .v{font-weight:600; font-variant-numeric:tabular-nums}
  .fhead{display:grid; grid-template-columns:150px minmax(0,1fr) 92px 96px; gap:12px; font-size:12px; color:var(--muted); margin-bottom:4px}
  .gtab{width:100%; border-collapse:collapse; font-size:14px; min-width:520px}
  .gtab th,.gtab td{text-align:right; padding:9px 8px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap}
  .gtab thead th{border-top:0; font-size:12px; color:var(--muted); font-weight:600}
  .gtab th[scope=row],.gtab thead th:first-child{text-align:left; font-weight:500}
  .nowg{font-size:12px; letter-spacing:.05em; text-transform:uppercase; color:#52525B; font-weight:600; margin:14px 0 4px}
  .nowg:first-child{margin-top:0}
  .nowi{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:14px}
  .nowi .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0}
  .nowi .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  @media (max-width:1100px){ .kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media (max-width:860px){ .ovtop{grid-template-columns:minmax(0,1fr)} .kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:560px){ .roi .big{font-size:38px} .frow,.fhead{grid-template-columns:96px minmax(0,1fr) 70px} .frow .ly,.fhead .ly{display:none} }
  .ovgrid{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start}
  .stagebars{display:flex; flex-direction:column; gap:9px}
  .sbar{display:grid; grid-template-columns:130px minmax(0,1fr) 36px; gap:10px; align-items:center; font-size:14px}
  .sbar .track{height:10px; background:var(--track); border-radius:5px; overflow:hidden}
  .sbar .fillb{height:100%; border-radius:5px}
  .sbar .c{text-align:right; color:var(--muted); font-variant-numeric:tabular-nums}
  .minis{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:16px}
  .rel{display:grid; grid-template-columns:78px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line); font-size:14px}
  .rel:first-child{border-top:0}
  .rel .d{color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums}

<script>
const ARC_LEN=Math.PI*130, clamp=(n,a,b)=>Math.max(a,Math.min(b,n)), esc=s=>String(s).replace(/</g,'&lt;'),
      escA=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
// Six categorical hues, validated for colour-blind separation on the white card
// (worst adjacent pair ΔE 9.1 protan). Never extend this list to colour more
// series — anything past the sixth folds into OTHER.
const PALETTE=['#0099FF','#EB6834','#1BAF7A','#EDA100','#E87BA4','#4A3AA7'], OTHER='#A1A1AA';
const LANE={backlog:'#A1A1AA',todo:'#FF6969',progress:'#FB923C',done:'#48D87D'};
let accessKey=null, selMonth=null, monthsAvail=[];
const STRINGS={
  en:{ locale:'en-GB', tasks:'Tasks', hours:'Monthly hours', toDo:'To do', inProgress:'In progress', backlog:'Backlog', completed:'Completed',
    noneTodo:'Nothing queued', noneProg:'Nothing in progress', noneBack:'Empty', more:n=>`+ ${n} more`,
    due:'Due', subtasks:'Subtasks', byTask:'Time by task', other:'Other', usedThisMonth:'used this month', total:'Total', thisMonth:'this month',
    remaining:'Remaining', left:'left', overBudget:'over budget', overRetainer:'over the retainer',
    resets:'Resets', inDays:d=>`in ${d} days`, trackedIn:m=>`tracked in ${m}`, billingPeriod:'Billing period',
    invoicedMonthly:'invoiced monthly', basis:'Basis', basisVal:'T&M', basisSub:'time & materials',
    newPeriod:'New period', updated:'Last updated: ', refresh:'Refresh', logout:'Log out', error:"Couldn't load. Try again.", performance:'Performance', openLink:'Open',
    newRequest:'Submit a task', reqName:'What do you need?', reqDesc:'Details (optional)',
    send:'Send task', sending:'Sending…', sent:'Task added to your list ✓', sendErr:'Could not send. Try again.', tooShort:'Add a short title first.',
    usedIn:m=>`used in ${m}`, inMonth:m=>`in ${m}`, over:'Over', delivered:'Delivered', tasksClosed:'tasks closed',
    period:'Period', closedPeriod:'closed', prevMonth:'Previous month', nextMonth:'Next month',
    pastNote:'Closed month. The task list always shows today’s status.' },
  fr:{ locale:'fr-FR', tasks:'Tâches', hours:'Heures du mois', toDo:'À faire', inProgress:'En cours', backlog:'Backlog', completed:'Terminé',
    noneTodo:'Rien en attente', noneProg:'Rien en cours', noneBack:'Vide', more:n=>`+ ${n} autres`,
    due:'Échéance', subtasks:'Sous-tâches', byTask:'Temps par tâche', other:'Autres', usedThisMonth:'utilisées ce mois', total:'Total', thisMonth:'ce mois',
    remaining:'Restant', left:'restant', overBudget:'dépassement', overRetainer:'dépassement du forfait',
    resets:'Remise à zéro', inDays:d=>`dans ${d} j`, trackedIn:m=>`suivi en ${m}`, billingPeriod:'Période de facturation',
    invoicedMonthly:'facturé mensuellement', basis:'Base', basisVal:'Régie', basisSub:'au temps passé',
    newPeriod:'Nouvelle période', updated:'Dernière mise à jour : ', refresh:'Actualiser', logout:'Se déconnecter', error:'Impossible de charger. Réessayer.', performance:'Performance', openLink:'Ouvrir',
    newRequest:'Soumettre une tâche', reqName:'De quoi as-tu besoin ?', reqDesc:'Détails (optionnel)',
    send:'Envoyer la tâche', sending:'Envoi…', sent:'Tâche ajoutée à ta liste ✓', sendErr:"Échec de l'envoi. Réessayer.", tooShort:"Ajoute d'abord un titre court.",
    usedIn:m=>`utilisées en ${m}`, inMonth:m=>`en ${m}`, over:'Dépassement', delivered:'Livré', tasksClosed:'tâches clôturées',
    period:'Période', closedPeriod:'clôturée', prevMonth:'Mois précédent', nextMonth:'Mois suivant',
    pastNote:'Mois clôturé. La liste de tâches affiche toujours le statut actuel.' }
};
let S=STRINGS.en, nf=new Intl.NumberFormat('en-GB',{maximumFractionDigits:1});
const daysTo=iso=>Math.max(0,Math.ceil((new Date(iso)-Date.now())/86400000));
const fmtDate=iso=>new Date(iso).toLocaleDateString(S.locale,{day:'numeric',month:'short',year:'numeric'});
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
const monthLong=iso=>cap1(new Date(iso).toLocaleDateString(S.locale,{month:'long',year:'numeric'}));
const monthName=iso=>new Date(iso).toLocaleDateString(S.locale,{month:'long'});
const monthShort=iso=>cap1(new Date(iso).toLocaleDateString(S.locale,{month:'short',year:'numeric'}));

function applyLogo(img,textEl,url){
  if(url){ img.onerror=()=>{img.style.display='none';textEl.style.display='inline';};
    textEl.style.display='none'; img.style.display='block'; img.src=url; }
  else { img.style.display='none'; textEl.style.display='inline'; }
}
function setLogos(d){
  applyLogo(document.getElementById('cxoLogo'),document.getElementById('cxoName'),d.cxoLogo);
  const cn=document.getElementById('clientName'); cn.textContent=d.name;
  document.getElementById('clientLogo').alt=d.name;
  applyLogo(document.getElementById('clientLogo'),cn,d.logo);
}
function taskHTML(t,done,laneColor){
  const hasDetail=(t.desc&&t.desc.length)||t.due||(t.subs&&t.subs.length);
  const chev=hasDetail?'<span class="chev">›</span>':'';
  let detail='';
  if(hasDetail){
    let parts='';
    if(t.due) parts+=`<div class="dmeta">${S.due}: ${fmtDate(t.due)}</div>`;
    if(t.desc&&t.desc.length) parts+=`<div class="ddesc">${esc(t.desc)}</div>`;
    if(t.subs&&t.subs.length){
      parts+=`<div class="dsubh">${S.subtasks} (${t.subs.length})</div>`+
        t.subs.map(s=>`<div class="sub"><span class="dot" style="background:${s.done?'#48D87D':laneColor}"></span><span class="name${s.done?' done':''}">${esc(s.name)}</span></div>`).join('');
    }
    detail=`<div class="tdetail hide">${parts}</div>`;
  }
  return `<div class="titem"><div class="tcard${done?' done':''}${hasDetail?' clk':''}"><span class="dot" style="background:${laneColor}"></span><span class="name">${esc(t.name)}</span>${chev}</div>${detail}</div>`;
}
function fill(el,countEl,items,emptyMsg,done,laneColor){
  const cap=12;
  if(items&&items.length){
    let h=items.slice(0,cap).map(t=>taskHTML(t,done,laneColor)).join('');
    if(items.length>cap) h+=`<div class="more">${S.more(items.length-cap)}</div>`;
    el.innerHTML=h;
  } else el.innerHTML=`<div class="empty">${emptyMsg}</div>`;
  countEl.textContent=items?items.length:0;
}
function renderPerf(d){
  const c=document.getElementById('perfCard');
  if(!d.perfUrl){ c.classList.add('hide'); c.removeAttribute('href'); return; }
  c.href=d.perfUrl;
  document.getElementById('perfHeading').textContent=S.performance;
  document.getElementById('perfDesc').textContent=d.perfLabel||S.performance;
  document.getElementById('perfBtn').textContent=S.openLink+' ↗';
  c.classList.remove('hide');
}
function renderBoard(d){
  document.getElementById('tasksPanelTitle').textContent=S.tasks;
  document.getElementById('gBackT').textContent=S.backlog;
  document.getElementById('gTodoT').textContent=S.toDo;
  document.getElementById('gProgT').textContent=S.inProgress;
  document.getElementById('gDoneT').textContent=S.completed;
  const b=d.board||{todo:[],progress:[],backlog:[],done:[]};
  fill(document.getElementById('gBack'),document.getElementById('gBackC'),b.backlog,S.noneBack,false,LANE.backlog);
  fill(document.getElementById('gTodo'),document.getElementById('gTodoC'),b.todo,S.noneTodo,false,LANE.todo);
  fill(document.getElementById('gProg'),document.getElementById('gProgC'),b.progress,S.noneProg,false,LANE.progress);
  fill(document.getElementById('gDone'),document.getElementById('gDoneC'),b.done,'—',true,LANE.done);
  const c=d.statusCounts||{todo:0,progress:0,backlog:0,done:0};
  document.getElementById('scBack').textContent=c.backlog;
  document.getElementById('scTodo').textContent=c.todo;
  document.getElementById('scProg').textContent=c.progress;
  document.getElementById('scDone').textContent=c.done;
  document.getElementById('scBackL').textContent=S.backlog;
  document.getElementById('scTodoL').textContent=S.toDo;
  document.getElementById('scProgL').textContent=S.inProgress;
  document.getElementById('scDoneL').textContent=S.completed;
  document.getElementById('reqTitle').textContent=S.newRequest;
  document.getElementById('reqName').placeholder=S.reqName;
  document.getElementById('reqDesc').placeholder=S.reqDesc;
  document.getElementById('reqSend').textContent=S.send;
  document.getElementById('scorecard').classList.remove('hide');
  document.getElementById('grid').classList.remove('hide');
}
function renderByHours(tasks){
  document.getElementById('byhoursTitle').textContent=S.byTask;
  const box=document.getElementById('byhoursBox'), list=document.getElementById('byhoursList');
  if(tasks&&tasks.length){
    list.innerHTML=tasks.map((t,i)=>`<div class="trow"><span class="left"><span class="dot" style="background:${PALETTE[i]||OTHER}"></span><span class="name">${esc(t.name)}</span></span><span class="hrs">${nf.format(t.hours)} h</span></div>`).join('');
    box.hidden=false;
  } else box.hidden=true;
}
function renderRetainer(d){
  document.getElementById('hoursPanelTitle').textContent=S.hours;
  document.getElementById('paygView').classList.add('hide');
  document.getElementById('retainerView').classList.remove('hide');
  const cs=getComputedStyle(document.documentElement); const f=d.spent/d.cap;
  const color=f>1?cs.getPropertyValue('--over'):f>=0.75?cs.getPropertyValue('--warn'):cs.getPropertyValue('--good');
  document.documentElement.style.setProperty('--state',color.trim());
  const past=d.isCurrent===false, mName=monthName(d.periodStartISO), over=d.remaining<0;
  document.getElementById('rSpent').textContent=nf.format(d.spent);
  document.getElementById('rUsedLabel').textContent=past?S.usedIn(mName):S.usedThisMonth;
  document.getElementById('rkTotal').textContent=S.total;
  document.getElementById('rTotal').textContent=nf.format(d.cap)+' h';
  document.getElementById('rsTotal').textContent=past?S.inMonth(mName):S.thisMonth;
  const rem=document.getElementById('rRemaining'),remSub=document.getElementById('rRemainingSub');
  if(past){
    // Closed month: an overrun is worth showing, unused hours are not.
    document.getElementById('rkRem').textContent=over?S.over:S.delivered;
    rem.textContent=over?('+'+nf.format(Math.abs(d.remaining))+' h'):String(d.delivered||0);
    remSub.textContent=over?S.overRetainer:S.tasksClosed;
    rem.classList.toggle('state',over);

  const hide=id=>document.getElementById(id).classList.add('hide');

  const perf=document.getElementById('perfCard');

  ['rSpent','pSpent','rTotal','rRemaining','rReset','pPeriodPill','pReset','mLabel']
    .forEach(id=>document.getElementById(id).textContent='—');

async function loadWith(pw,month,force){
  // Closed months are immutable → let them hit the CDN cache. Only bust the live month.
  const live=!month||!monthsAvail.length||month===monthsAvail[monthsAvail.length-1];
  let url='/api/hours?k='+encodeURIComponent(pw||'');
  if(month) url+='&month='+encodeURIComponent(month);
  const r=live?await fetch(url+'&t='+Date.now(),{cache:'no-store'}):await fetch(url);
  if(r.status===403) return false;
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json(); if(d.error) throw new Error(d.error);
  // The cockpit (store data + timeline) loads once per login or on Refresh, not on every month switch.
  const fresh=force||pw!==cockpitFor;
  if(fresh) resetCockpit();
  accessKey=pw; applyData(d);
  if(fresh) loadCockpit(pw,d);
  return true;
}
function showError(){
  document.getElementById('updated').textContent='';

}
async function refresh(){
  const e=document.querySelector('.error'); if(e)e.remove();

}
async function goMonth(step){
  const i=monthsAvail.indexOf(selMonth); if(i<0) return;
  const target=monthsAvail[i+step]; if(!target) return;
  const e=document.querySelector('.error'); if(e)e.remove();
  const nav=document.getElementById('monthNav'); nav.classList.add('busy');
  try{ await loadWith(accessKey,target); } catch(err){ showError(); }
  finally{ nav.classList.remove('busy'); }
}
async function submitReq(){
  const nameEl=document.getElementById('reqName'), descEl=document.getElementById('reqDesc');
  const btn=document.getElementById('reqSend'), msg=document.getElementById('reqMsg');
  const name=nameEl.value.trim(); msg.className='reqmsg';
  if(name.length<3){ msg.textContent=S.tooShort; msg.classList.add('err'); return; }
  btn.disabled=true; msg.textContent=S.sending;
  try{
    const r=await fetch('/api/submit-task',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({k:accessKey,title:name,description:descEl.value})});
    const j=await r.json();
    if(!r.ok||j.error) throw new Error(j.error||'HTTP '+r.status);
    nameEl.value=''; descEl.value='';
    msg.textContent=S.sent; msg.classList.add('ok');
    setTimeout(refresh,900);
  }catch(e){ msg.textContent=S.sendErr; msg.classList.add('err'); }
  finally{ btn.disabled=false; }
}

      card(C.sales,money(cur.sales),'sales')+card(C.orders,intf(cur.orders),'orders')+card(C.aov,money(cur.aov),'aov')+
      (!perf.trustSessions&&cu?card2(C.newCust,intf(cu.newCustomers),pc(cu.newCustomers,cu.newCustomersLY))+card2(C.retCust,intf(cu.returning),pc(cu.returning,cu.returningLY)):'');
    if(!perf.trustSessions){ renderGrowth(G); hs.classList.remove('hide'); return renderOverviewRest(); }
    const LY=H.lastYear;
    const max=Math.max(cur.atcRate||0,(LY&&LY.atcRate)||0)||1;
    const row=(label,a,b)=>`<div class="frow"><span>${label}</span><span class="bars"><span class="b"><span style="width:${(a/max*100).toFixed(1)}%;background:#0099FF"></span></span>${b!=null?`<span class="b"><span style="width:${(b/max*100).toFixed(1)}%;background:#A1A1AA"></span></span>`:''}</span><span class="v">${p2(a)}</span><span class="ly muted">${b!=null?p2(b):''}</span></div>`;
    document.getElementById('funnelPanel').innerHTML=`<div class="paneltitle">${C.funnel}</div>
      <div class="fhead"><span></span><span><span style="color:#0099FF">■</span> ${C.now13} &nbsp; <span style="color:#A1A1AA">■</span> ${C.ly13}</span><span>${C.now13}</span><span class="ly">${C.ly13}</span></div>
      ${row(C.atc,cur.atcRate,LY&&LY.atcRate)}${row(C.ckr,cur.checkoutRate,LY&&LY.checkoutRate)}${row(C.conv,cur.cr,LY&&LY.cr)}
      ${perf.qualifiedSessions?`<div class="muted" style="margin-top:10px">${C.qualified}</div>`:''}`;
    hs.classList.remove('hide');
  } else hs.classList.add('hide');
  renderOverviewRest();
}
function renderGrowth(G){
  const fp=document.getElementById('funnelPanel');
  if(!G||!G.bySource||!G.bySource.length){ fp.innerHTML=''; return; }
  const ch=x=>x==null?'–':pctTxt(x), cls=x=>x==null?'':x>0.005?'up':x<-0.005?'down':'';
  const rows=G.bySource.filter(r=>r.sales>50||r.salesLY>50).map(r=>`<tr><th scope="row">${esc(C.src[r.key]||r.key)}</th><td>${money(r.salesLY)}</td><td>${money(r.sales)}</td><td><span class="delta ${cls(r.change)}">${ch(r.change)}</span></td><td class="sh">${r.shareOfGrowth==null?'–':Math.round(r.shareOfGrowth*100)+' %'}</td></tr>`).join('');
  const shop=(G.byChannel||[]).find(x=>/^shop$/i.test(x.key));
  fp.innerHTML=`<div class="paneltitle">${C.growthTitle}</div><div class="muted" style="margin:-8px 0 12px">${C.growthMeta}</div>
    <div style="overflow-x:auto"><table class="gtab"><thead><tr><th></th><th>${C.lyCol}</th><th>${C.nowCol}</th><th>${C.chgCol}</th><th class="sh">${C.shareCol}</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${shop?`<div class="muted" style="margin-top:10px">${C.viaChannel}: ${money(shop.salesLY)} → ${money(shop.sales)}</div>`:''}
    <div class="muted" style="margin-top:6px">${C.convHold}</div>`;
}
function renderOverviewRest(){
  // Now & next, from the live task board
  document.getElementById('nowTitle').textContent=C.nowTitle;
  const b=curBoard||{progress:[],todo:[]};
  const li=(t,col)=>`<div class="nowi"><span class="dot" style="background:${col}"></span><span class="nm" title="${escA(t.name)}">${esc(t.name)}</span></div>`;
  const waiting=[...(b.progress||[]),...(b.todo||[])].filter(t=>/waiting|attente/i.test(t.status||''));
  const prog=(b.progress||[]).filter(t=>!waiting.includes(t));
  const next=(b.todo||[]).filter(t=>!waiting.includes(t)).slice(0,3);
  let nh='';
  if(prog.length) nh+=`<div class="nowg">${C.inProgress}</div>`+prog.slice(0,5).map(t=>li(t,LANE.progress)).join('');
  if(waiting.length) nh+=`<div class="nowg">${C.waiting}</div>`+waiting.map(t=>li(t,'#E08A2E')).join('');
  if(next.length) nh+=`<div class="nowg">${C.next}</div>`+next.map(t=>li(t,LANE.todo)).join('');
  document.getElementById('nowList').innerHTML=nh||`<div class="muted">${C.nothingNow}</div>`;

  // Latest releases
  document.getElementById('latestTitle').textContent=C.latest;
  document.getElementById('toTimeline').textContent=C.seeAll+' →';
  if(!tl) return;
  const live=tl.items.filter(i=>i.goLive&&i.goLive>=(tl.day0||'0000'));
  const latest=[...live].sort((a,b)=>b.goLive.localeCompare(a.goLive)).slice(0,6);
  document.getElementById('latestList').innerHTML=latest.length?latest.map(i=>`<div class="rel"><span class="d">${dShort(i.goLive)}</span><span class="nm" title="${escA(i.name)}">${esc(i.name)}</span>${stageChip(i.stage)}</div>`).join(''):`<div class="muted">${C.noItems}</div>`;
}
function stageChip(s){ if(!s) return `<span class="chip st">${C.ops}</span>`; return `<span class="chip st"><span class="sw" style="background:${STAGE_COL[s]}"></span>${C.stage[s]}</span>`; }
// A test with no verdict is 'running' until its end date, then 'pending' (finished, verdict not entered yet).
const testState=i=>i.verdict||((i.end||i.goLive)&&(i.end||i.goLive)<new Date().toISOString().slice(0,10)?'pending':'running');
function verdictChip(i){
  if(i.type!=='test') return `<span class="chip vd">${C.type[i.type]||''}</span>`;
  const v=testState(i), cls=v==='winner'?'win':v==='loser'?'lose':v==='running'?'run':'';
  return `<span class="chip vd ${cls}">${C.type.test} · ${C.verdict[v]||v}</span>`;
}

// ── timeline chart ──
const METRICS={ sales:{l:()=>C.sales,sum:true,f:w=>w.s}, orders:{l:()=>C.orders,sum:true,f:w=>w.o}, aov:{l:()=>C.aov,num:w=>w.s,den:w=>w.o},
  rpv:{l:()=>C.rpv,needsSessions:true,calc:win=>{ const v=win.reduce((s,x)=>s+x.v,0), o=win.reduce((s,x)=>s+x.o,0); return v&&o?(win.reduce((s,x)=>s+x.x,0)/v)*(win.reduce((s,x)=>s+x.s,0)/o):null; }},
  cr:{l:()=>C.cr,num:w=>w.x,den:w=>w.v,needsSessions:true,pct:true} };
function renderMetricSeg(){
  document.getElementById('tlTitle').textContent=C.tlTitle;
  const keys=(sessionsOk()?['rpv','cr','aov','sales','orders']:['sales','orders','aov']).filter(k=>!METRICS[k].needsSessions||sessionsOk());
  if(!perf){ document.getElementById('metricSeg').innerHTML=''; return; }
  if(!keys.includes(metric)) metric=keys[0];
  document.getElementById('metricSeg').innerHTML=keys.map(k=>`<button type="button" data-m="${k}" aria-pressed="${k===metric}">${METRICS[k].l()}</button>`).join('');
}
// 4-week rolling value: sums are averaged per week, ratios are recomputed on the 4-week totals.
function rolling(weeks,m){
  const M=METRICS[m];
  return weeks.map((w,i)=>{ const win=weeks.slice(Math.max(0,i-3),i+1);
    if(M.sum) return win.reduce((s,x)=>s+M.f(x),0)/win.length;
    if(M.calc) return M.calc(win);
    const n=win.reduce((s,x)=>s+M.num(x),0), d=win.reduce((s,x)=>s+M.den(x),0); return d?n/d:null; });
}
function niceMax(v){ if(!v) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))), r=v/p; return (r<=1.2?1.2:r<=1.5?1.5:r<=2?2:r<=2.5?2.5:r<=3?3:r<=4?4:r<=5?5:r<=6?6:r<=8?8:10)*p; }
function renderChart(){
  const svg=document.getElementById('chart');
  if(document.getElementById('viewTimeline').classList.contains('hide')) return;
  const W=1000, X0=104, X1=984, PT=14, PH=200, PY=PT+PH, LT=PY+26, LH=22, LB=LT+STAGES.length*LH, H=LB+28;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('aria-label',C.tlTitle);
  const weeksAll=perf?perf.weeks:[];
  const d0=perf?perf.day0:(tl&&tl.day0);
  if(!d0){ svg.innerHTML=''; return; }
  const d0t=Date.parse(d0);
  const firstW=weeksAll.length?Date.parse(weeksAll[0].w):d0t-13*WEEKMS;
  const tStart=Math.max(firstW,d0t-13*WEEKMS), tEnd=weeksAll.length?Date.parse(weeksAll[weeksAll.length-1].w)+WEEKMS:Date.now();
  const x=t=>X0+(t-tStart)/(tEnd-tStart)*(X1-X0);
  let g='';
  // baseline shading + Day 0 rule
  g+=`<rect x="${X0}" y="${PT}" width="${Math.max(0,x(d0t)-X0)}" height="${PH}" fill="#F4F4F5"></rect>`;
  g+=`<text x="${X0+6}" y="${PT+14}">${esc(C.before)}</text>`;
  // month ticks
  const span=(tEnd-tStart)/(30*DAYMS), every=span>15?3:span>8?2:1;
  const m=new Date(tStart); m.setUTCDate(1); m.setUTCHours(0,0,0,0); m.setUTCMonth(m.getUTCMonth()+1);
  for(let i=0; m.getTime()<tEnd; i++, m.setUTCMonth(m.getUTCMonth()+1)){
    const xx=x(m.getTime());
    g+=`<line x1="${xx}" x2="${xx}" y1="${PT}" y2="${LB}" stroke="#EDEDF0"></line>`;
    if(m.getUTCMonth()%every===0) g+=`<text x="${xx}" y="${LB+18}" text-anchor="middle">${new Date(m).toLocaleDateString(S.locale,{month:'short',year:'2-digit'})}</text>`;
  }
  if(perf&&weeksAll.length){
    const M=METRICS[metric], roll=rolling(weeksAll,metric);
    const idx=new Map(weeksAll.map((w,i)=>[w.w,i]));
    const pts=[], ly=[];
    weeksAll.forEach((w,i)=>{ const t=Date.parse(w.w); if(t<tStart) return;
      pts.push([t+3.5*DAYMS,roll[i],w.w]);
      const j=idx.get(new Date(t-364*DAYMS).toISOString().slice(0,10)); ly.push([t+3.5*DAYMS,j!=null?roll[j]:null]); });
    const vmax=niceMax(Math.max(...pts.map(p=>p[1]||0),...ly.map(p=>p[1]||0)));
    const y=v=>PY-v/vmax*PH;
    const fmt=v=>M.pct?(v*100).toLocaleString(S.locale,{maximumFractionDigits:2})+' %':metric==='orders'?intf(v):money(v,true);
    for(let k=0;k<=4;k++){ const v=vmax*k/4, yy=y(v); g+=`<line x1="${X0}" x2="${X1}" y1="${yy}" y2="${yy}" stroke="${k?'#EDEDF0':'#D4D4D8'}"></line><text x="${X0-8}" y="${yy+4}" text-anchor="end">${esc(fmt(v))}</text>`; }
    const path=arr=>{ let d='',on=false; arr.forEach(p=>{ if(p[1]==null){on=false;return;} d+=(on?'L':'M')+x(p[0]).toFixed(1)+' '+y(p[1]).toFixed(1); on=true; }); return d; };
    g+=`<path d="${path(ly)}" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="5 4"></path>`;
    g+=`<path d="${path(pts)}" fill="none" stroke="#0099FF" stroke-width="2.6" stroke-linejoin="round"></path>`;
    // hover targets: one per week, native tooltip
    const bw=(X1-X0)/pts.length;
    pts.forEach((p,i)=>{ const l=ly[i][1]; g+=`<rect x="${(x(p[0])-bw/2).toFixed(1)}" y="${PT}" width="${bw.toFixed(1)}" height="${PH}" fill="transparent"><title>${esc(dShort(p[2]))} · ${esc(M.l())}: ${esc(fmt(p[1]))}${l!=null?` · ${esc(C.ly)}: ${esc(fmt(l))}`:''}</title></rect>`; });
  }
  // Day 0 rule on top of everything in the plot
  g+=`<line x1="${x(d0t)}" x2="${x(d0t)}" y1="${PT}" y2="${LB}" stroke="#09090B" stroke-width="1.2" stroke-dasharray="3 3"></line>`;
  g+=`<text x="${x(d0t)+5}" y="${PT+14}" style="fill:#09090B;font-weight:600">${esc(C.day0)}</text>`;
  // lanes
  STAGES.forEach((s,i)=>{ const yy=LT+i*LH+LH/2;
    g+=`<line x1="${X0}" x2="${X1}" y1="${yy}" y2="${yy}" stroke="#EDEDF0"></line><text class="lane-l" x="${X0-8}" y="${yy+4}" text-anchor="end">${esc(C.stage[s])}</text>`; });
  if(tl) tl.items.forEach(it=>{
    if(!it.stage) return; const yy=LT+STAGES.indexOf(it.stage)*LH+LH/2;
    if(it.type==='test'&&it.start){
      const a=Math.max(Date.parse(it.start),tStart), b=Math.min(Date.parse(it.end||it.goLive||it.start)+DAYMS,tEnd); if(b<tStart||a>tEnd) return;
      const st=testState(it), col=VERDICT_COL[st], wd=Math.max(5,x(b)-x(a));
      g+=`<rect x="${x(a).toFixed(1)}" y="${yy-5}" width="${wd.toFixed(1)}" height="10" rx="3" fill="${col||'#FFFFFF'}" stroke="${col||(st==='running'?'#FB923C':'#71717A')}" stroke-width="1.5"><title>${esc(it.name)} · ${esc(dShort(it.start))} → ${esc(dShort(it.end||it.goLive||it.start))} · ${esc(C.verdict[st]||'')}</title></rect>`;
    } else if(it.goLive){
      const t=Date.parse(it.goLive); if(t<tStart||t>tEnd) return;
      g+=`<circle cx="${x(t).toFixed(1)}" cy="${yy}" r="4.5" fill="${STAGE_COL[it.stage]}" stroke="#FFFFFF" stroke-width="1.2"><title>${esc(dShort(it.goLive))} · ${esc(it.name)}</title></circle>`;
    }
  });
  svg.innerHTML=g;
  document.getElementById('legend').innerHTML=(perf?`<span><i></i>${esc(METRICS[metric].l())} · ${C.rolling}</span><span><i class="ly"></i>${C.ly}</span>`:'')+
    `<span><i class="dot"></i>${C.live}</span><span><i class="bar"></i>${C.testBar}</span><span><i class="bar" style="background:#fff;border:1.5px solid #71717A"></i>${C.verdict.pending}</span>`;
}
function renderLog(){
  document.getElementById('logTitle').textContent=C.logTitle;
  if(!tl){ document.getElementById('filters').innerHTML=''; document.getElementById('log').innerHTML=''; return; }
  const items=tl.items.filter(i=>i.goLive||i.start);
  const present=[...STAGES.filter(s=>items.some(i=>i.stage===s)),...(items.some(i=>!i.stage)?['ops']:[])];
  if(stageFilter!=='all'&&!present.includes(stageFilter)) stageFilter='all';
  document.getElementById('filters').innerHTML=[`<button type="button" data-f="all" aria-pressed="${stageFilter==='all'}">${C.all}</button>`,
    ...present.map(s=>`<button type="button" data-f="${s}" aria-pressed="${stageFilter===s}"><span class="sw" style="background:${STAGE_COL[s]||'#A1A1AA'}"></span>${s==='ops'?C.ops:C.stage[s]}</button>`)].join('');
  const shown=items.filter(i=>stageFilter==='all'||(stageFilter==='ops'?!i.stage:i.stage===stageFilter))
    .sort((a,b)=>(b.goLive||b.start).localeCompare(a.goLive||a.start));
  let h='', month='';
  const LOG_CAP=40;
  (logAll?shown:shown.slice(0,LOG_CAP)).forEach(i=>{ const d=i.goLive||i.start, mk=d.slice(0,7);
    if(mk!==month){ month=mk; h+=`<div class="logm">${cap1(new Date(d).toLocaleDateString(S.locale,{month:'long',year:'numeric'}))}</div>`; }
    h+=`<div class="rel4"><span class="d">${dShort(d)}</span>${stageChip(i.stage)}<span class="nm" title="${escA(i.name)}">${esc(i.name)}</span>${verdictChip(i)}</div>`; });
  if(!logAll&&shown.length>LOG_CAP) h+=`<div style="margin-top:12px"><button class="linkbtn" type="button" id="logMore">${C.showAll(shown.length)}</button></div>`;
  document.getElementById('log').innerHTML=h||`<div class="muted">${C.noItems}</div>`;
}
function resetCockpit(){
  perf=null; tl=null; cockpitFor=null; stageFilter='all'; logAll=false;
  document.getElementById('tabs').classList.add('hide');
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected','false'));
  ['viewOverview','viewTimeline'].forEach(v=>document.getElementById(v).classList.add('hide'));
  document.getElementById('viewWork').classList.remove('hide');
  ['kpis','minis','latestList','nowList','metricSeg','legend','filters','log','roiPanel','funnelPanel','healthTitle','healthMeta'].forEach(id=>document.getElementById(id).innerHTML='');
  document.getElementById('roiPanel').classList.add('hide'); document.getElementById('health').classList.add('hide'); curBoard=null;
  document.getElementById('chart').innerHTML='';
  const e=document.getElementById('ovError'); e.textContent=''; e.classList.add('hide');
}
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-view]'); if(b) setView(b.dataset.view); });
document.getElementById('tabs').addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;
  const bs=[...document.querySelectorAll('#tabs button')].filter(b=>!b.hidden), i=bs.indexOf(document.activeElement); if(i<0) return;
  const n=bs[(i+(e.key==='ArrowRight'?1:-1)+bs.length)%bs.length]; n.focus(); setView(n.dataset.view);
});
document.getElementById('toTimeline').addEventListener('click',()=>setView('viewTimeline'));
document.getElementById('metricSeg').addEventListener('click',e=>{ const b=e.target.closest('button[data-m]'); if(!b) return; metric=b.dataset.m; renderMetricSeg(); renderChart(); });
document.getElementById('filters').addEventListener('click',e=>{ const b=e.target.closest('button[data-f]'); if(!b) return; stageFilter=b.dataset.f; logAll=false; renderLog(); });
document.getElementById('log').addEventListener('click',e=>{ if(e.target.id==='logMore'){ logAll=true; renderLog(); } });

// expand/collapse task detail (event delegation)
document.addEventListener('click',ev=>{
  const card=ev.target.closest('.tcard.clk'); if(!card) return;
  const item=card.closest('.titem'); const det=item.querySelector('.tdetail');
  if(det){ det.classList.toggle('hide'); item.classList.toggle('open'); }
});
const shellEl=document.getElementById('shell'), gateEl=document.getElementById('gate');
const GATE={ hint:'Enter your website to open your dashboard.', hint2:'Entrez votre site pour ouvrir votre tableau de bord.', ph:'yourdomain.com', enter:'Enter', wrong:'Wrong domain — try again · Domaine incorrect', err:'Something went wrong · Une erreur est survenue', invalid:'Unknown portal link · Lien de portail inconnu' };
const normDomain=v=>String(v||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/+$/,'');
function showGate(){
  shellEl.style.display='none'; gateEl.classList.remove('hide');
  setTimeout(()=>{const i=document.getElementById('gatePw'); if(i)i.focus();},60);
}
function hideGate(){ gateEl.classList.add('hide'); shellEl.style.display=''; }
async function tryPassword(){
  const inp=document.getElementById('gatePw'), msg=document.getElementById('gateMsg'), btn=document.getElementById('gateBtn');
  const pw=normDomain(inp.value); if(!pw) return;
  btn.disabled=true; msg.textContent='…'; msg.className='gatemsg';
  try{
    if(await loadWith(pw)){
      try{localStorage.setItem('cxoportal:pw',pw);}catch(e){}
      msg.textContent='';
      document.getElementById('gateForm').style.display='none';
      const succ=document.getElementById('gateSuccess');
      document.getElementById('gateSuccessLabel').textContent=(S&&S.locale==='fr-FR')?'Connexion réussie':"You're in";
      succ.style.display='block';
      requestAnimationFrame(()=>succ.classList.add('play'));
      setTimeout(()=>{ shellEl.style.display=''; gateEl.classList.add('done'); }, 1050);
      setTimeout(()=>{
        gateEl.classList.add('hide'); gateEl.classList.remove('done');
        succ.style.display='none'; succ.classList.remove('play');
        document.getElementById('gateForm').style.display='';
        btn.textContent=GATE.enter; btn.disabled=false;
      }, 1500);
      return;
    }
    msg.textContent=GATE.wrong; msg.className='gatemsg err';
  }catch(e){ msg.textContent=GATE.err; msg.className='gatemsg err'; }
  btn.disabled=false;
}
async function init(){
  document.getElementById('gateHint').textContent=GATE.hint;
  document.getElementById('gateHint2').textContent=GATE.hint2;
  document.getElementById('gatePw').placeholder=GATE.ph;
  document.getElementById('gateBtn').textContent=GATE.enter;
  const urlKey=new URLSearchParams(location.search).get('k');
  if(urlKey){ try{ if(await loadWith(urlKey)){ hideGate(); return; } }catch(e){} }
  let saved=null; try{ saved=localStorage.getItem('cxoportal:pw'); }catch(e){}
  if(saved){ try{ if(await loadWith(saved)){ hideGate(); return; } }catch(e){} try{localStorage.removeItem('cxoportal:pw');}catch(e){} }
  showGate();
}
document.getElementById('refresh').addEventListener('click',refresh);
document.getElementById('reqSend').addEventListener('click',submitReq);
document.getElementById('mPrev').addEventListener('click',()=>goMonth(-1));
document.getElementById('mNext').addEventListener('click',()=>goMonth(1));
document.getElementById('logout').addEventListener('click',()=>{
  try{localStorage.removeItem('cxoportal:pw');}catch(e){}
  accessKey=null; selMonth=null; monthsAvail=[]; S=STRINGS.en;
  resetView(); resetCockpit();
  try{localStorage.removeItem('cxoportal:tab');}catch(e){}
  document.getElementById('scorecard').classList.add('hide');
  document.getElementById('grid').classList.add('hide');
  document.getElementById('updated').textContent='';
  if(location.search){ try{ history.replaceState(null,'',location.pathname); }catch(e){} }
  const inp=document.getElementById('gatePw'); if(inp) inp.value='';
  const m=document.getElementById('gateMsg'); if(m){ m.textContent=''; m.className='gatemsg'; }
  showGate();
});
document.getElementById('gateBtn').addEventListener('click',tryPassword);
document.getElementById('gatePw').addEventListener('keydown',e=>{ if(e.key==='Enter') tryPassword(); });
init();
