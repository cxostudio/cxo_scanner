name: Supabase Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # TESTING ONLY — change to '0 3 * * *' when verified
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed 's:/*$::')"
          if [ -z "$URL" ]; then
            echo "::error::SUPABASE_URL secret is empty"
            exit 1
          fi
          echo "Time: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Host: $(printf '%s' "$URL" | sed -E 's#https?://([^/]+).*#\1#')"

          set +e
          RESPONSE=$(curl -sS \
            --retry 3 --retry-all-errors --max-time 30 \
            -o /dev/null -w "%{http_code}" \
            -X GET "$URL/rest/v1/user_progress?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          CURL_EXIT=$?
          set -e

          echo "curl exit: $CURL_EXIT | HTTP: $RESPONSE"
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::curl failed (exit $CURL_EXIT)"
            exit 1
          fi
          if [ "$RESPONSE" != "200" ]; then
            echo "::error::Unexpected HTTP $RESPONSE"
            exit 1
          fi
          echo "Supabase is alive."
